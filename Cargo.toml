[package]
name = "cc-session-finder"
version = "0.1.0"
edition = "2021"
description = "Fast keyword finder for Claude Code sessions"
license = "MIT"

[[bin]]
name = "cc-session-finder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
unicode-width = "0.1"
unicode-segmentation = "1"
glob = "0.3"
dirs = "5"
atty = "0.2"

# TUI
ratatui = "0.28"
crossterm = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
